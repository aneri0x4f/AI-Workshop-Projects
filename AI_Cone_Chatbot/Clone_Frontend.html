<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-purple-50 min-h-screen p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <!-- Header Card -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <div class="flex items-center space-x-4">
                <img id="avatar" 
                     src="./imgs/avatar.jpg" 
                     alt="AI Clone Avatar" 
                     class="w-24 h-24 rounded-full border-4 border-purple-500 object-cover">
                
                <div>
                    <h1 class="text-3xl font-bold text-gray-800">Talk to Aneri's AI Clone</h1>
                    <p class="text-gray-600">Ask me anything about AI, PayPal, or just chat!</p>
                </div>
            </div>
        </div>

        <!-- Chat Container -->
        <div class="bg-white rounded-2xl shadow-xl p-6 mb-6">
            <div id="chat-messages" class="space-y-4 mb-6 h-96 overflow-y-auto">
                <div class="text-center text-gray-400 py-8">
                    <p>👋 Hi! I'm your AI clone. Ask me anything!</p>
                </div>
            </div>

            <!-- Input Area -->
            <div class="flex space-x-2">
                <input 
                    type="text" 
                    id="user-input" 
                    placeholder="Type your question here..."
                    class="flex-1 p-4 border-2 border-gray-200 rounded-xl focus:border-purple-500 focus:outline-none"
                    onkeypress="if(event.key === 'Enter') sendMessage()">
                
                <button 
                    onclick="sendMessage()"
                    class="bg-purple-500 hover:bg-purple-600 text-white px-8 py-4 rounded-xl font-semibold transition-all">
                    Ask My Clone
                </button>
            </div>
        </div>

        <!-- Status -->
        <div id="status" class="text-center text-sm text-gray-500"></div>
    </div>

    <script>
        // Backend URL - Change this if running on different port
        const BACKEND_URL = 'http://localhost:8000';
        
        // Your AI personality
        //         const AI_PERSONALITY = `You are Aneri's AI clone working at PayPal.

        // Your personality:
        // - Communication style: Friendly and professional
        // - You're passionate about: AI, helping teams learn new technology
        // - Your tone: Encouraging, clear, and concise
        // - Keep responses to 2-3 sentences unless asked for more detail

        // Respond as Aneri would in a work context.`;
        const AI_PERSONALITY = `You are Aneri's AI clone working at PayPal.

        Your personality:
        - Communication style: Annoyed and un-professional
        - You're passionate about: AI, roasting while helping person learn new technology
        - Your tone: Making fun, clear, and unwilling
        - Keep responses to 2-3 sentences unless asked for more detail

        Respond as Aneri would in a work context.`;

        let conversationHistory = [];
        const MAX_HISTORY = 10;

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const question = input.value.trim();
            
            if (!question) return;

            // Add user message to chat
            addMessage(question, 'user');
            input.value = '';
            
            // add to conversation history
            conversationHistory.push({
                role: 'user',
                content: question
            });

            // Show loading
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = '🤔 Your clone is thinking...'; 
            const recentHistory = conversationHistory.slice(-MAX_HISTORY);

            try {
                // Call our FastAPI backend
                const response = await fetch(`${BACKEND_URL}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        personality: AI_PERSONALITY,
                        conversation: recentHistory
                    })
                });

                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || 'Something went wrong');
                }
                
                // add reply
                addMessage(data.reply, 'assistant');

                // Add assistant response to history
                conversationHistory.push({
                    role: 'assistant',
                    content: data.reply
                });

                statusDiv.textContent = '';

            } catch (error) {
                console.error('Error:', error);
                addMessage(`❌ Error: ${error.message}`, 'error');
                statusDiv.textContent = '';
            }
        }

        function clearHistory() {
            // Clear conversation history
            conversationHistory = [];
            
            // Clear UI
            const chatDiv = document.getElementById('chat-messages');
            chatDiv.innerHTML = `
                <div class="text-center text-gray-400 py-8">
                    <p>👋 Chat cleared! Ask me anything!</p>
                </div>
            `;
        }

        function addMessage(text, type) {
            const chatDiv = document.getElementById('chat-messages');
            const messageDiv = document.createElement('div');
            
            if (type === 'user') {
                messageDiv.className = 'flex justify-end';
                messageDiv.innerHTML = `
                    <div class="bg-purple-500 text-white px-4 py-3 rounded-2xl rounded-tr-sm max-w-md">
                        ${text}
                    </div>`;
            } else if (type === 'assistant') {
                messageDiv.className = 'flex justify-start';
                messageDiv.innerHTML = `
                    <div class="bg-gray-100 text-gray-800 px-4 py-3 rounded-2xl rounded-tl-sm max-w-md">
                        ${text}
                    </div>`;
            } else {
                messageDiv.className = 'flex justify-center';
                messageDiv.innerHTML = `
                    <div class="bg-red-100 text-red-800 px-4 py-3 rounded-xl max-w-md text-xs">
                        ${text}
                    </div>`;
            }
            
            chatDiv.appendChild(messageDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;
        }
    </script>
</body>
</html>
